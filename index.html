<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sandman AI — Automation Workflows</title>
  <meta name="description" content="Plug-and-play automation workflows. Import, configure, run. No code required.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
 
    body {
      font-family: 'Inter', sans-serif;
      background: #0F0F0F;
      color: #1A1A1A;
      min-height: 100vh;
    }
 
    a {
      text-decoration: none;
      color: inherit;
    }
 
    /* Navigation */
    nav {
      background: #0F0F0F;
      padding: 14px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
    }
 
    .logo {
      font-size: 15px;
      font-weight: 600;
      color: #FFFFFF;
      letter-spacing: 0.05em;
    }
 
    .nav-items {
      display: flex;
      gap: 20px;
      align-items: center;
    }
 
    .nav-items a {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.45);
      transition: color 0.2s;
    }
 
    .nav-items a.accent {
      color: #F59E0B;
      font-weight: 500;
    }
 
    .nav-items a:hover {
      color: rgba(255, 255, 255, 0.7);
    }
 
    /* Hero */
    .hero {
      background: #0F0F0F;
      padding: 64px 32px 56px;
      text-align: center;
    }
 
    .hero-content {
      max-width: 580px;
      margin: 0 auto;
    }
 
    .hero h1 {
      font-size: 48px;
      font-weight: 500;
      line-height: 1.1;
      color: #FFFFFF;
      margin-bottom: 16px;
    }
 
    .hero h1 .accent {
      color: #F59E0B;
    }
 
    .hero p {
      font-size: 16px;
      color: rgba(255, 255, 255, 0.5);
      line-height: 1.65;
      margin-bottom: 32px;
    }
 
    .hero-buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
 
    .btn {
      padding: 13px 28px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      display: inline-block;
    }
 
    .btn-primary {
      background: #F59E0B;
      color: #0F0F0F;
    }
 
    .btn-primary:hover {
      opacity: 0.9;
    }
 
    .btn-secondary {
      background: transparent;
      color: rgba(255, 255, 255, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
 
    .btn-secondary:hover {
      border-color: rgba(255, 255, 255, 0.4);
      color: rgba(255, 255, 255, 0.9);
    }
 
 
 
    /* Templates Section */
    .templates {
      background: #F7F5F0;
      padding: 48px 32px;
    }
 
    .templates-content {
      max-width: 900px;
      margin: 0 auto;
    }
 
    .section-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: #999;
      text-transform: uppercase;
      margin-bottom: 20px;
    }
 
    .section-label.paid {
      margin-top: 40px;
    }
 
    /* Free Templates Grid */
    .free-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 40px;
    }
 
    .free-card {
      background: white;
      border: 1px solid #E5E2DC;
      border-radius: 12px;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      transition: border-color 0.2s;
    }
 
    .free-card:hover {
      border-color: #F59E0B;
    }
 
    .free-card-left h3 {
      font-size: 14px;
      font-weight: 500;
      color: #1A1A1A;
      margin-bottom: 4px;
    }
 
    .free-card-left p {
      font-size: 12px;
      color: #888;
      line-height: 1.5;
    }
 
    .free-btn {
      background: transparent;
      border: 1px solid #F59E0B;
      color: #F59E0B;
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.2s;
      cursor: pointer;
    }
 
    .free-btn:hover {
      background: #F59E0B;
      color: #0F0F0F;
    }
 
    /* Paid Templates Grid */
    .paid-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }
 
    .paid-card {
      background: white;
      border: 1px solid #E5E2DC;
      border-radius: 14px;
      overflow: hidden;
      transition: box-shadow 0.2s;
    }
 
    .paid-card:hover {
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }
 
    .paid-thumbnail {
      min-height: 130px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
      text-align: center;
      position: relative;
      flex-direction: column;
    }
 
    .paid-hook {
      font-size: 17px;
      font-weight: 800;
      color: white;
      text-transform: uppercase;
      line-height: 1.2;
      letter-spacing: 0.01em;
    }
 
    .paid-accent-line {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      margin-top: 10px;
    }
 
    .paid-watermark {
      position: absolute;
      bottom: 8px;
      right: 12px;
      font-size: 8px;
      color: rgba(255, 255, 255, 0.2);
      letter-spacing: 0.08em;
    }
 
    .paid-info {
      padding: 16px 20px;
    }
 
    .paid-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 6px;
      gap: 12px;
    }
 
    .paid-name {
      font-size: 14px;
      font-weight: 500;
      color: #1A1A1A;
    }
 
    .paid-price {
      font-size: 14px;
      font-weight: 500;
      color: #1A1A1A;
      white-space: nowrap;
    }
 
    .paid-description {
      font-size: 12px;
      color: #888;
      line-height: 1.5;
      margin-bottom: 12px;
    }
 
    .paid-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }
 
    .paid-tag {
      background: #F0EDE8;
      color: #888;
      font-size: 10px;
      padding: 3px 9px;
      border-radius: 4px;
    }
 
    .paid-link {
      color: #F59E0B;
      font-size: 13px;
      font-weight: 500;
      display: block;
      transition: text-decoration 0.2s;
    }
 
    .paid-link:hover {
      text-decoration: underline;
    }
 
    /* Starter Pack Banner */
    .starter-banner {
      margin-top: 40px;
      background: #0F0F0F;
      border-radius: 14px;
      padding: 28px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
 
    .starter-left p:first-child {
      font-size: 15px;
      font-weight: 500;
      color: #FFFFFF;
      margin-bottom: 4px;
    }
 
    .starter-left p:last-child {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.4);
    }
 
    .starter-btn {
      background: #F59E0B;
      color: #0F0F0F;
      padding: 11px 22px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      border: none;
      cursor: pointer;
      transition: opacity 0.2s;
    }
 
    .starter-btn:hover {
      opacity: 0.9;
    }
 
    /* Footer */
    footer {
      background: #0F0F0F;
      padding: 22px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.07);
    }
 
    .footer-left {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.3);
    }
 
    .footer-links {
      display: flex;
      gap: 20px;
    }
 
    .footer-links a {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.3);
      transition: color 0.2s;
    }
 
    .footer-links a:hover {
      color: rgba(255, 255, 255, 0.7);
    }
 
    /* Loading State */
    .loading {
      text-align: center;
      padding: 40px;
      color: rgba(255, 255, 255, 0.5);
    }
 
    /* Mobile Responsive */
    @media (max-width: 640px) {
      nav {
        padding: 14px 20px;
      }
 
      .nav-items {
        display: none;
      }
 
      .hero {
        padding: 40px 20px 36px;
      }
 
      .hero h1 {
        font-size: 36px;
      }
 
      .hero-buttons {
        flex-direction: column;
        gap: 8px;
      }
 
      .btn {
        width: 100%;
      }
 
      .templates {
        padding: 32px 20px;
      }
 
      .free-grid,
      .paid-grid {
        grid-template-columns: 1fr;
      }
 
      .starter-banner {
        flex-direction: column;
        align-items: flex-start;
      }
 
      footer {
        flex-direction: column;
        align-items: flex-start;
        padding: 16px 20px;
      }
 
      .footer-links {
        width: 100%;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
 
  <!-- Navigation -->
  <nav>
    <div class="logo">SANDMAN AI</div>
    <div class="nav-items">
      <a href="#templates">Templates</a>
      <a href="#free">Free tools</a>
      <a href="#templates" class="accent">Automation workflows</a>
    </div>
  </nav>
 
  <!-- Hero -->
  <div class="hero">
    <div class="hero-content">
      <h1>Your business,<br><span class="accent">working while you sleep.</span></h1>
      <p>Plug-and-play automation workflows. Import, configure, run. No code required.</p>
      <div class="hero-buttons">
        <a href="" class="btn btn-primary" id="hero-starter-btn">Get the free starter pack</a>
        <a href="#templates" class="btn btn-secondary">Browse templates</a>
      </div>
    </div>
  </div>
 
  <!-- Templates Section -->
  <div class="templates">
    <div class="templates-content">
      <div id="templates"></div>
    </div>
  </div>
 
  <!-- Footer -->
  <footer>
    <div class="footer-left">© 2025 Sandman AI · sandmanai.gumroad.com</div>
    <div class="footer-links">
      <a href="https://www.facebook.com/sandmanaiinfo">Facebook</a>
      <a href="https://www.instagram.com/sandmanaiinfo">Instagram</a>
      <a href="mailto:hello@sandmanai.com">Email</a>
    </div>
  </footer>
 
  <script>
    // Accent line mapping by category
    function getAccentLine(category) {
      if (category === 'Cold Email' || category === 'LinkedIn') {
        return 'FREE PROMPT PACK INSIDE';
      } else if (category === 'Finance' || category === 'Productivity' || category === 'Intelligence') {
        return 'FREE MINI GUIDE INSIDE';
      } else if (category === 'Slack' || category === 'Notion') {
        return 'FREE WORKFLOW INSIDE';
      }
      return 'FREE TEMPLATE INSIDE';
    }
 
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const response = await fetch('data.json');
        if (!response.ok) throw new Error('Failed to load data.json');
        const data = await response.json();
 
        const templatesContainer = document.getElementById('templates');
        let html = '';
 
        // Free templates (exclude last item - the starter pack)
        const freeTemplates = data.free.slice(0, -1);
        if (freeTemplates.length > 0) {
          html += '<div class="section-label">// START HERE — FREE</div>';
          html += '<div class="free-grid">';
          freeTemplates.forEach(template => {
            html += `
              <a href="${template.gumroad_url}" class="free-card">
                <div class="free-card-left">
                  <h3>${template.name}</h3>
                  <p>${template.description}</p>
                </div>
                <button class="free-btn">FREE DOWNLOAD →</button>
              </a>
            `;
          });
          html += '</div>';
        }
 
        // Paid templates
        if (data.paid.length > 0) {
          html += '<div class="section-label paid">// PAID TEMPLATES</div>';
          html += '<div class="paid-grid">';
          data.paid.forEach(template => {
            const accentLine = getAccentLine(template.category);
            html += `
              <div class="paid-card">
                <div class="paid-thumbnail" style="background-color: ${template.thumbnail_color}">
                  <div class="paid-hook">${template.hook}</div>
                  <div class="paid-accent-line" style="color: ${template.accent_color}">${accentLine}</div>
                  <div class="paid-watermark">SANDMAN AI</div>
                </div>
                <div class="paid-info">
                  <div class="paid-header">
                    <div class="paid-name">${template.name}</div>
                    <div class="paid-price">$${template.price}</div>
                  </div>
                  <div class="paid-description">${template.description}</div>
                  <div class="paid-tags">
                    ${template.tags.map(tag => `<span class="paid-tag">${tag}</span>`).join('')}
                  </div>
                  <a href="${template.gumroad_url}" class="paid-link">Get template →</a>
                </div>
              </div>
            `;
          });
          html += '</div>';
        }
 
        // Starter pack banner (last free item)
        const starterPack = data.free[data.free.length - 1];
        html += `
          <div class="starter-banner">
            <div class="starter-left">
              <p>${starterPack.name}</p>
              <p>${starterPack.description}</p>
            </div>
            <a href="${starterPack.gumroad_url}" class="starter-btn">Free download →</a>
          </div>
        `;
 
        // Set hero button URL to starter pack
        document.getElementById('hero-starter-btn').href = starterPack.gumroad_url;
 
        // Inject HTML
        templatesContainer.innerHTML = html;
      } catch (error) {
        console.error('Error loading templates:', error);
        document.getElementById('templates').innerHTML = '<div class="loading">Templates loading...</div>';
      }
    });
  </script>
 
</body>
</html>
